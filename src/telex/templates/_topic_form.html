<form class="topic-form" method="post" action="{{ '/t/' ~ topic.id ~ '/edit' if topic else '/new' }}">
  <label class="field">
    <span class="label">Topic</span>
    <input name="title" type="text" required maxlength="80" value="{{ values.title }}" placeholder="Swiss pension reform" autocomplete="off">
  </label>

  <label class="field">
    <span class="label">How should it be reported?</span>
    <textarea name="brief" rows="{{ brief_rows | default(5) }}" required maxlength="2000" placeholder="Primary sources first. Separate what was decided from what was proposed.">{{ values.brief }}</textarea>
  </label>

  {% set units = {"daily": "day", "weekly": "week", "monthly": "month"} %}
  <fieldset class="field">
    <legend class="label">Schedule</legend>
    <div class="every-row">
      <label class="every-n"><span class="label">Every</span>
        <input name="every" type="number" inputmode="numeric" min="1" max="{{ max_every }}" step="1" value="{{ values.every }}" required>
      </label>
      <div class="segmented">
        {% for c in cadences %}
        <label><input type="radio" name="cadence" value="{{ c }}" {% if values.cadence == c %}checked{% endif %}><span data-unit="{{ units[c] }}">{{ units[c] }}{% if values.every != 1 %}s{% endif %}</span></label>
        {% endfor %}
      </div>
    </div>
  </fieldset>

  <label class="field until-field">
    <span class="label">Next report (optional)</span>
    <input name="next" type="date" min="{{ next_min }}" value="{{ next_value }}">
    <span class="hint label">Leave empty for the quietest day</span>
  </label>

  <label class="field until-field">
    <span class="label">Ends on (optional)</span>
    <input name="until" type="date" value="{{ until_value }}">
  </label>

  <fieldset class="field">
    <legend class="label">Languages</legend>
    <label class="check">
      <input type="checkbox" name="local" {% if values.local %}checked{% endif %}>
      <span>Search local languages — the places and every side involved</span>
    </label>
    <span class="label">Also search in</span>
    <div class="chips">
      {% for lang in languages %}
      <label><input type="checkbox" name="extra_languages" value="{{ lang }}" {% if lang in values.extra_languages %}checked{% endif %}><span>{{ lang }}</span></label>
      {% endfor %}
    </div>
  </fieldset>

  <label class="field">
    <span class="label">Wire terms (optional, one per line)</span>
    <textarea name="watch" rows="3" spellcheck="false" autocapitalize="off" placeholder="Generalitat&#10;rent cap&#10;strike & rail">{{ values.watch | join("\n") }}</textarea>
    <span class="hint label">Matched against feed headlines in any language. Whole words; a & b needs both; word* matches the start. The run updates these after each report.</span>
  </label>

  {% if topic %}
  <label class="check">
    <input type="checkbox" name="active" {% if values.active %}checked{% endif %}>
    <span>Active — untick to pause without losing history</span>
  </label>
  {% endif %}

  <p class="preview label" id="slot-preview"
     data-suggestions='{{ suggestions | tojson }}'
     data-original="{{ original_key }}"
     data-current="{{ current_next }}"
     data-new="{{ '' if topic else '1' }}">{{ preview }}</p>

  <button class="btn btn-primary btn-wide" type="submit">{{ "Save" if topic else "Add topic" }}</button>
</form>
