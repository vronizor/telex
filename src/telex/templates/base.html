<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Telex{% endblock %}</title>
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/static/themes/{{ theme }}.css?v={{ static_version }}">
<link rel="stylesheet" href="/static/app.css?v={{ static_version }}">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#0d1117">
<script src="/static/app.js?v={{ static_version }}" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="Telex, home">
    <img src="/static/icon.svg" width="22" height="22" alt="">
    <span class="label">Telex</span><span class="cursor" aria-hidden="true"></span>
  </a>
  <nav class="topbar-actions">
    <a class="btn btn-ghost label" href="/#new">+ New</a>
    <button class="btn btn-ghost icon" type="button" data-theme-toggle aria-label="Switch light or dark theme">◐</button>
    <form method="post" action="/sync">
      <input type="hidden" name="back" value="{{ request.url.path }}">
      <button class="btn btn-ghost label{% if repo.last_error %} is-error{% endif %}" type="submit"
        {% if repo.last_error %}title="{{ repo.last_error }}"{% endif %}>
        {%- if repo.last_error %}Sync failed{% elif repo.last_sync %}Sync {{ repo.last_sync.astimezone(settings.timezone).strftime("%H:%M") }}{% else %}Sync{% endif -%}
      </button>
    </form>
  </nav>
</header>
{% set section = "radio" if request.url.path.startswith("/radio") else "sources" if request.url.path.startswith("/sources") else "reports" %}
<nav class="tabs" aria-label="Sections">
  <div class="tabs-inner">
    <a class="tab label" href="/"{% if section == "reports" %} aria-current="page"{% endif %}>Reports</a>
    <a class="tab label" href="/radio"{% if section == "radio" %} aria-current="page"{% endif %}>Radio</a>
    <a class="tab label" href="/sources"{% if section == "sources" %} aria-current="page"{% endif %}>Sources</a>
  </div>
</nav>
<main class="page">
{% block content %}{% endblock %}
</main>
</body>
</html>
