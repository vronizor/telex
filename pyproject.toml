[project]
name = "telex"
version = "0.1.0"
description = "Self-hosted reader for scheduled news briefings kept in a git repository"
requires-python = ">=3.12"
dependencies = [
    "ebooklib>=0.20",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "pillow>=13.0.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
radio = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "kokoro-onnx==0.6.1",
    "misaki==0.9.4",
    "num2words>=0.5",
    "numpy>=2",
    "preshed<3.0.14",
    "soundfile>=0.13",
    "spacy>=3.8,<3.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests", "data-template/scripts"]
