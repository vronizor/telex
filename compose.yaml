name: telex

services:
  app:
    build: .
    image: telex-app
    restart: unless-stopped
    env_file: .env
    environment:
      TELEX_DATA_DIR: /data
      GIT_SSH_COMMAND: >-
        ssh -i /keys/deploy_key -o IdentitiesOnly=yes
        -o UserKnownHostsFile=/data/known_hosts -o StrictHostKeyChecking=accept-new
    volumes:
      - ${TELEX_HOST_DATA_DIR:-./data}:/data
      - ${TELEX_DEPLOY_KEY:-./deploy_key}:/keys/deploy_key:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8020}:8000"

  tts:
    build:
      context: .
      dockerfile: radio.Dockerfile
    image: telex-tts
    restart: unless-stopped
    env_file: .env
    environment:
      TELEX_DATA_DIR: /data
      TZ: ${TELEX_TZ:-Europe/Madrid}
    volumes:
      - ${TELEX_HOST_DATA_DIR:-./data}:/data
